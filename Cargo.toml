[package]
name = "usagenometer"
version = "0.1.3-beta"
edition = "2024"
rust-version = "1.85"
description = "usagenometer — AI usage meters in the terminal"
authors = ["horizzon3507 <148660626+horizzon3507@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/horizzon3507/usagenometer"
repository = "https://github.com/horizzon3507/usagenometer"
documentation = "https://github.com/horizzon3507/usagenometer#readme"
keywords = ["ai", "usage", "quota", "cli", "codex"]
categories = ["command-line-utilities"]
exclude = ["target/", ".github/", "dist/", "icons/", "schemas/", "tests/"]

[[bin]]
name = "usagenometer"
path = "src/main.rs"

[[bin]]
name = "usg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "color", "env"] }
clap_complete = "4"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
