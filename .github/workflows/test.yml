name: test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test --locked

      - name: cargo build
        run: cargo build --locked
